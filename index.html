    <style>
        body {
            background-color: #FDFBF7;
            color: #4A3E3D;
            font-family: 'Noto Sans JP', sans-serif;
            overflow-x: hidden;
        }

        /* 3D Bookshelf & Spine Styles */
        .perspective-container {
            perspective: 1200px;
            perspective-origin: 50% 40%;
        }

        .bookshelf-3d {
            transform-style: preserve-3d;
            background: linear-gradient(135deg, #A47E5B 0%, #7E5C3D 100%);
            box-shadow: 
                0 30px 60px -12px rgba(50, 30, 20, 0.4),
                inset 0 0 40px rgba(0, 0, 0, 0.3),
                inset 0 4px 15px rgba(255, 255, 255, 0.25);
            border-radius: 28px;
            position: relative;
        }

        .shelf-plank {
            background: linear-gradient(180deg, #D4B69B 0%, #8C6645 40%, #5E412A 100%);
            box-shadow: 
                0 14px 20px rgba(45, 25, 15, 0.35),
                inset 0 3px 6px rgba(255, 255, 255, 0.4),
                inset 0 -3px 6px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .book-spine {
            transform-style: preserve-3d;
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            cursor: pointer;
            position: relative;
            transform-origin: bottom center;
            border-radius: 3px 6px 6px 3px;
        }

        .book-spine::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, 
                rgba(255,255,255,0.45) 0%, 
                rgba(255,255,255,0.0) 12%, 
                rgba(0,0,0,0.0) 80%, 
                rgba(0,0,0,0.3) 100%
            );
            pointer-events: none;
        }

        .book-spine::after {
            content: '';
            position: absolute;
            top: 4px; bottom: 4px; right: -4px;
            width: 4px;
            background: linear-gradient(90deg, #EAE5D9 0%, #D4CEBF 100%);
            box-shadow: 1px 0 2px rgba(0,0,0,0.2);
            border-radius: 0 2px 2px 0;
        }

        .book-spine:hover, .book-spine.pulled-out {
            transform: translateZ(50px) translateY(-24px) scale(1.06);
            box-shadow: -12px 24px 30px rgba(35, 20, 10, 0.4), 0 0 15px rgba(255, 255, 255, 0.3);
            z-index: 40;
        }

        .book-spine.highlighted {
            animation: pulseHighlight 1.5s infinite alternate;
        }

        @keyframes pulseHighlight {
            0% { transform: translateZ(40px) translateY(-16px) scale(1.04); }
            100% { transform: translateZ(60px) translateY(-28px) scale(1.08); }
        }

        .writing-vertical {
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }

        /* Custom Scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Autocomplete dropdown styling */
        .suggest-item:hover {
            background-color: #EBF0E9;
        }
    </style>
</head>

            { title: 'ブルーロック', vol: 28, genre: 'マンガ', desc: '世界一のエゴイストストライカーを育成する極限サッカー。', color: '#457B9D' },
            { title: 'キングダム', vol: 71, genre: 'マンガ', desc: '中華統一を目指す少年・信と後の始皇帝・政の大河戦国大作！', color: '#8C533E' },
            { title: '名探偵コナン', vol: 104, genre: 'マンガ', desc: '身体は縮んでも頭脳は同じ！難事件を次々解決する推理マンガ。', color: '#3A5A40' },
            { title: '変な家', vol: 2, genre: '小説', desc: '間取り図の謎から浮かびあがる恐ろしい事実を描くミステリー。', color: '#3D405B' },
            { title: '成瀬は天下を取りにいく', vol: 1, genre: '小説', desc: '本屋大賞受賞！滋賀県大津市を舞台にした最高の青春小説。', color: '#F4A261' },
            { title: 'プロジェクト・ヘイル・メアリー', vol: 2, genre: '小説', desc: '地球滅亡の危機を救うため宇宙へ旅立つ感動のSF金字塔。', color: '#2A9D8F' },
            { title: 'Tailwind CSS実践ガイド', vol: 1, genre: '実用・技術', desc: '効率的なモダンWebデザインとUI構築のベストプラクティス。', color: '#0077B6' }
        ];

        // User's Local Storage Bookshelf State
        let books = JSON.parse(localStorage.getItem('house_shelf_user_books')) || [];
        let activeBookId = null;
        let activeGenreFilter = 'all';

        window.onload = function() {
            if (books.length > 0) {
                selectBook(books[0].id);
            }
            renderBookshelf();
        };

        function saveBooks() {
            localStorage.setItem('house_shelf_user_books', JSON.stringify(books));
        }

        function renderBookshelf() {
            const query = document.getElementById('app-search').value.toLowerCase().trim();
            const tiers = [
                document.getElementById('tier-1'),
                document.getElementById('tier-2'),
                document.getElementById('tier-3'),
                document.getElementById('tier-4')
            ];
            const emptyNotice = document.getElementById('empty-shelf-notice');
            const activeCard = document.getElementById('active-book-card');

            // Clear tiers
            tiers.forEach(t => t.innerHTML = '');

            if (books.length === 0) {
                emptyNotice.classList.remove('hidden');
                activeCard.classList.add('hidden');
                return;
            } else {
                emptyNotice.classList.add('hidden');
                activeCard.classList.remove('hidden');
            }

            // Filter books
            const filtered = books.filter(b => {
                const matchQuery = b.title.toLowerCase().includes(query) || b.genre.toLowerCase().includes(query);
                const matchGenre = activeGenreFilter === 'all' || b.genre === activeGenreFilter;
                return matchQuery && matchGenre;
            });

            filtered.forEach((book, idx) => {
                const tierIndex = idx % 4;
                const isSelected = book.id === activeBookId;
                const isMatchSearch = query !== '' && book.title.toLowerCase().includes(query);

                const spine = document.createElement('div');
                spine.className = `book-spine flex-shrink-0 flex flex-col justify-between p-1.5 ${isSelected ? 'pulled-out' : ''} ${isMatchSearch ? 'highlighted' : ''}`;
                spine.style.backgroundColor = book.color || '#7C9070';
                spine.style.width = `${Math.min(book.width || 44, 60)}px`;
                spine.style.height = `${Math.min(book.height || 200, 220)}px`;
                spine.onclick = () => selectBook(book.id);

                spine.innerHTML = `
                    <span class="writing-vertical font-rounded font-bold text-[10px] sm:text-xs tracking-widest mx-auto mt-1 text-white">${book.title}</span>
                    <span class="font-rounded font-black text-[9px] sm:text-[11px] text-center bg-white/20 text-white rounded py-0.5">${book.vol}巻</span>
                `;

                tiers[tierIndex].appendChild(spine);
            });
        }

        function selectBook(id) {
            activeBookId = id;
            const book = books.find(b => b.id === id);
            if (!book) return;

            document.getElementById('active-title').innerText = book.title;
            document.getElementById('active-vol').innerText = `${book.vol}巻`;
            document.getElementById('active-vol-count').innerText = book.vol;
            document.getElementById('active-genre').innerText = book.genre;
            document.getElementById('active-date').innerText = `購入: ${book.date || '未登録'}`;
            document.getElementById('active-desc').innerText = book.desc || 'メモ未登録';
            document.getElementById('active-badge').style.backgroundColor = book.color || '#7C9070';

            // Update modal details
            document.getElementById('detail-title').innerText = book.title;
            document.getElementById('detail-vol').innerText = book.vol;
            document.getElementById('detail-genre').innerText = book.genre;
            document.getElementById('detail-date').innerText = book.date || '未登録';
            document.getElementById('detail-release').innerText = book.release || '未登録';
            document.getElementById('detail-desc').innerText = book.desc || 'メモ未登録';

            renderBookshelf();
        }

        // Fast volume increment / decrement (+/-)
        function adjustVolume(delta) {
            if (!activeBookId) return;
            const book = books.find(b => b.id === activeBookId);
            if (book) {
                book.vol = Math.max(1, (book.vol || 1) + delta);
                saveBooks();
                selectBook(book.id);
            }
        }

        // Autocomplete Candidate Search Suggestion Handler
        function onTitleInput(text) {
            const suggestBox = document.getElementById('suggest-box');
            const val = text.toLowerCase().trim();
            suggestBox.innerHTML = '';

            if (!val) {
                suggestBox.classList.add('hidden');
                return;
            }

            const matches = presetCandidates.filter(c => c.title.toLowerCase().includes(val));

            if (matches.length === 0) {
                suggestBox.classList.add('hidden');
                return;
            }

            matches.forEach(m => {
                const item = document.createElement('div');
                item.className = 'suggest-item p-3 cursor-pointer transition-colors flex items-center justify-between text-xs text-warmBrown';
                item.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full" style="background-color: ${m.color}"></span>
                        <span class="font-bold">${m.title}</span>
                    </div>
                    <span class="text-[10px] text-warmBrown/60 bg-cream border border-woodLight/20 px-2 py-0.5 rounded-full">全${m.vol}巻目安</span>
                `;
                item.onclick = () => {
                    document.getElementById('form-title').value = m.title;
                    document.getElementById('form-vol').value = m.vol;
                    document.getElementById('form-genre').value = m.genre;
                    document.getElementById('form-desc').value = m.desc;
                    document.getElementById('form-title').setAttribute('data-color', m.color);
                    suggestBox.classList.add('hidden');
                };
                suggestBox.appendChild(item);
            });

            suggestBox.classList.remove('hidden');
        }

        function filterBookshelf() {
            const query = document.getElementById('app-search').value.trim();
            const countBanner = document.getElementById('search-count');
            if (query !== '') countBanner.classList.remove('hidden');
            else countBanner.classList.add('hidden');
            renderBookshelf();
        }

        function clearSearch() {
            document.getElementById('app-search').value = '';
            filterBookshelf();
        }

        function setGenreFilter(genre, btn) {
            activeGenreFilter = genre;
            document.querySelectorAll('.genre-tab').forEach(t => {
                t.className = 'genre-tab bg-creamDark text-warmBrown/70 hover:text-warmBrown text-xs font-bold px-3.5 py-2 rounded-full transition-all flex-shrink-0';
            });
            btn.className = 'genre-tab bg-sage text-white text-xs font-bold px-3.5 py-2 rounded-full transition-all flex-shrink-0';
            renderBookshelf();
        }

        function openAddModal() {
            document.getElementById('add-modal').classList.remove('hidden');
        }

        function closeAddModal() {
            document.getElementById('add-modal').classList.add('hidden');
            document.getElementById('suggest-box').classList.add('hidden');
        }

        function showDetailModal() {
            document.getElementById('detail-modal').classList.remove('hidden');
        }

        function closeDetailModal() {
            document.getElementById('detail-modal').classList.add('hidden');
        }

        function submitNewBook(e) {
            e.preventDefault();
            const titleInput = document.getElementById('form-title');
            const title = titleInput.value.trim();
            const vol = parseInt(document.getElementById('form-vol').value) || 1;
            const genre = document.getElementById('form-genre').value;
            const date = document.getElementById('form-date').value || new Date().toISOString().split('T')[0];
            const release = document.getElementById('form-release').value;
            const desc = document.getElementById('form-desc').value.trim();
            const customColor = titleInput.getAttribute('data-color');

            const presetColors = ['#7C9070', '#E5A97D', '#5B8266', '#C08552', '#3B6E8C', '#A3485E', '#D97736'];
            const randomColor = customColor || presetColors[Math.floor(Math.random() * presetColors.length)];

            const newBook = {
                id: Date.now(),
                title,
                vol,
                genre,
                date,
                release,
                desc: desc || `${title}の蔵書メモ`,
                color: randomColor,
                width: Math.floor(Math.random() * 15) + 40,
                height: Math.floor(Math.random() * 30) + 190
            };

            books.unshift(newBook);
            saveBooks();
            closeAddModal();
            selectBook(newBook.id);

            // Reset form
            titleInput.value = '';
            titleInput.removeAttribute('data-color');
            document.getElementById('form-vol').value = '';
            document.getElementById('form-desc').value = '';
        }

        function removeActiveBook() {
            if (!activeBookId) return;
            const book = books.find(b => b.id === activeBookId);
            if (confirm(`「${book.title}」を本棚から取り除きますか？`)) {
                books = books.filter(b => b.id !== activeBookId);
                saveBooks();
                if (books.length > 0) {
                    selectBook(books[0].id);
                } else {
                    activeBookId = null;
                    renderBookshelf();
                }
            }
        }
    </script>
</body>
</html>
